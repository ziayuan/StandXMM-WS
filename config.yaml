exchange:
  name: standx
  ws_url: "wss://perps.standx.com/ws-stream/v1"
  ws_api_url: "wss://perps.standx.com/ws-api/v1"
  # private_key: Moved to .env for security (STANDX_PRIVATE_KEY)
  chain_id: 56 # BSC

symbol: BTC-USD
grid:
  price_spread: 70
  price_step: 11
  grid_count: 1
  order_quantity: 0.03
  fill_cooldown_minutes: 30

system_watchdog:
  timeout_seconds: 120  # Global System Alert Timeout
  sound_alert: true
  telegram_alert: true

